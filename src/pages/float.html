<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阵容悬浮窗</title>
    <link rel="stylesheet" href="/styles/roco-pvp-page4.css">
    <link rel="stylesheet" href="/styles/float.css">
</head>
<body>
    <main id="floatStage" class="float-stage">
        <section class="lineup-all-div" aria-label="双方阵容展示">
            <div class="lineup-bg lineup-bg-left" aria-hidden="true"></div>
            <div class="lineup-outline" aria-hidden="true"></div>
            <section class="lineup lineup-left" aria-label="左侧阵容"></section>
            <section class="lineup lineup-right" aria-label="右侧阵容"></section>
        </section>
        <button id="floatCloseBtn" class="float-close" type="button" title="关闭悬浮窗">×</button>

        <div id="floatMenu" class="float-menu" hidden></div>

        <div id="floatPicker" class="float-picker" hidden>
            <div class="float-picker-head">
                <input id="floatPickerSearch" class="float-picker-search" type="text" placeholder="搜索精灵…" spellcheck="false" />
                <button id="floatPickerClose" class="float-picker-x" type="button" title="关闭">×</button>
            </div>
            <div id="floatPickerStrip" class="float-picker-strip"></div>
        </div>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/float.js"></script>
</body>
</html>
