appId: com.roco.pvp.controlpanel
productName: 洛克王国世界阵容同步推流
compression: store
directories:
  output: release
files:
  - dist-electron/**
  - dist/**
  - src/**
  - resources/**
  - package.json
  # 不打包非 MiSans 字体（阿里普惠 / YouSheBiaoTiHei 等改用系统已安装字体，未安装时回退 MiSans）
  - "!src/assets/fonts/**"
  - "!src/**/*.ttf"
  - "!src/**/*.ttc"
  - "!src/**/*.woff"
  - "!src/**/*.woff2"
  - "src/assets/fonts/MiSans-*.otf"
extraMetadata:
  main: dist-electron/electron/main.js
icon: build/icon.ico
mac:
  category: public.app-category.games
win:
  executableName: RocoPVPLineup
  icon: build/icon.ico
  artifactName: ${name}-Setup-${version}.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  guid: 5cf62ae6-1d1f-4a52-8ef7-6d2f0f0df2d1
  allowElevation: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 洛克王国世界阵容同步推流
  uninstallDisplayName: 洛克王国世界阵容同步推流
  runAfterFinish: false
  warningsAsErrors: false
  deleteAppDataOnUninstall: true
